# Refer ./setup/baseConfig.yaml for full set of config parameters

allow-other: true

logging:
  type: syslog
  level: log_debug

components:
  - libfuse
  - file_cache
  - attr_cache
  - azstorage

libfuse:
  attribute-expiration-sec: 120
  entry-expiration-sec: 120
  negative-entry-expiration-sec: 240

file_cache:
  path: ./cache
  timeout-sec: 120
  max-size-mb: 4096
  allow-non-empty-temp: true
  cleanup-on-start: true

attr_cache:
  timeout-sec: 7200

azstorage:
  type: block
  account-name: gailwmssa
  account-key: 
  mode: key
  container: geo-data-clone
